services:
  mysql:
    image: mysql:8.4
    container_name: qlhs-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-qlhs}
      MYSQL_USER: ${DB_USER:-qlhs}
      MYSQL_PASSWORD: ${DB_PASSWORD:-qlhs_secret}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - qlhs_mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  qlhs_mysql_data:
