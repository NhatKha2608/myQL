spring.datasource.url=jdbc:h2:mem:qlhs_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/dev

jwt.signerKey=test-signer-key-minimum-32-characters-long
qlhs.jwt.secret=${jwt.signerKey}
qlhs.cors.allowed-origins=http://localhost:3000

app.mail.enabled=false

spring.mail.host=localhost
spring.mail.port=1025
