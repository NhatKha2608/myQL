# Profile local — cùng kiểu cấu hình với sos-api/application-local.properties
# Chạy: mặc định SPRING_PROFILES_ACTIVE=local (xem application.properties)

spring.datasource.url=jdbc:mysql://localhost:3306/qlhs?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&useSSL=false
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.show-sql=true

# Schema + dữ liệu demo. Production không nạp classpath:db/dev.
spring.flyway.locations=classpath:db/migration,classpath:db/dev

server.address=0.0.0.0
server.port=8080

jwt.signerKey=qlhs-local-dev-signer-key-min-32-characters-long!!
qlhs.jwt.secret=${jwt.signerKey}

qlhs.cors.allowed-origins=http://localhost:3000
app.frontend.url=http://localhost:3000
qlhs.frontend.reset-password-url=http://localhost:3000/auth/reset-password

app.mail.enabled=false

logging.level.vn.edu.qlhs=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
