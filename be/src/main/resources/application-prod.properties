# Production — Render + Aiven MySQL. Secret chỉ lấy từ biến môi trường.

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Aiven Free giới hạn số kết nối. Một instance Render dùng pool nhỏ.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.keepalive-time=120000

# Chỉ schema. Không chạy seed demo (classpath:db/dev).
spring.flyway.locations=classpath:db/migration

server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

app.mail.enabled=${APP_MAIL_ENABLED:false}

app.admin.username=${APP_ADMIN_USERNAME:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.full-name=${APP_ADMIN_FULL_NAME:Quản trị hệ thống}

logging.level.vn.edu.qlhs=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
