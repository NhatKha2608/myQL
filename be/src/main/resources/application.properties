spring.application.name=qlhs-api
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# --- DataSource (production / CI: bắt buộc qua biến môi trường) ---
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway (giống sos-api) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# --- Server ---
server.address=${SERVER_ADDRESS:0.0.0.0}
# Render injects PORT. Local can still override with SERVER_PORT.
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-message=never
server.error.include-stacktrace=never

# --- Upload ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- JWT (tên khóa thống nhất với sos-api) ---
jwt.signerKey=${JWT_SIGNER_KEY}
qlhs.jwt.secret=${jwt.signerKey}
# 90 ngày (3 tháng). Đăng nhập một lần, không cần đăng nhập lại trong khoảng này.
qlhs.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:7776000000}
qlhs.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:7776000000}

# --- CORS & frontend ---
qlhs.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
qlhs.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}
qlhs.mail.from=${MAIL_FROM:noreply@qlhs.local}
qlhs.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/auth/reset-password}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:3000}

# --- Mail ---
app.mail.enabled=${APP_MAIL_ENABLED:false}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.mime.charset=UTF-8

# --- Actuator ---
management.endpoints.web.exposure.include=health,info

# --- OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Logging (chi tiết trong logback-spring.xml) ---
logging.level.root=INFO
logging.level.vn.edu.qlhs=INFO
